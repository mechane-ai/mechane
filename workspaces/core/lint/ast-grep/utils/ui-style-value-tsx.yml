id: ui-style-value-tsx
language: Tsx
rule:
  any:
    - inside:
        kind: call_expression
        has:
          field: function
          regex: ^stylex[.](create|createTheme)$
        stopBy: end
    - inside:
        kind: jsx_attribute
        has:
          kind: property_identifier
          regex: ^style$
        stopBy: end
