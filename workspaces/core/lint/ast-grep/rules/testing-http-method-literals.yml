# SC-12 in the test support package, whose folder the test patterns of contract 014's shipped rules skip. A copy of
# the shipped `http-method-literals-typescript` rule, which its registry entry pins by hash, for
# `packages/node/testing` alone: a method there is a member of `HttpMethod` too.
id: testing-http-method-literals
language: TypeScript
severity: error
message: 'Name the HTTP method by its closed set, such as `HttpMethod.Post` (SC-12)'
files: ['packages/node/testing/**/*.ts']
ignores: ['**/node_modules/**']
utils:
  # A literal that holds one uppercase method token other than `HEAD`.
  method-token:
    any:
      - kind: string
        regex: ^["'](GET|POST|PUT|PATCH|DELETE|OPTIONS|TRACE|CONNECT)["']$
      - kind: template_string
        regex: ^`(GET|POST|PUT|PATCH|DELETE|OPTIONS|TRACE|CONNECT)`$
  # A literal that holds one method token in any case, `HEAD` included.
  any-case-method-token:
    any:
      - kind: string
        regex: ^["'](?i:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|TRACE|CONNECT)["']$
      - kind: template_string
        regex: ^`(?i:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|TRACE|CONNECT)`$
  # A property or attribute name that holds a method, such as `method`, `formMethod`, or `httpMethod`, but not `deliveryMethod`.
  method-name:
    regex: ^["']?(?i:(form_?|http_?|request_?)?method)["']?$
  # An expression that reads such a name, such as `request.method`.
  method-read:
    regex: (^|[^A-Za-z0-9_$])(?i:(form_?|http_?|request_?)?method)([^A-Za-z0-9_$]|$)
  # A place where only a method belongs.
  method-position:
    any:
      # `{ method: 'head' }`.
      - inside:
          kind: pair
          field: value
          has:
            field: key
            matches: method-name
      # `method: 'get'` in a type.
      - inside:
          kind: literal_type
          inside:
            stopBy: end
            kind: type_annotation
            inside:
              kind: property_signature
              has:
                field: name
                matches: method-name
      # `request.method === 'head'`.
      - inside:
          kind: binary_expression
          all:
            - has:
                field: operator
                regex: ^[!=]==?$
            - has:
                matches: method-read
      # `case 'head':` in a `switch` on a method.
      - inside:
          kind: switch_case
          field: value
          inside:
            kind: switch_body
            inside:
              kind: switch_statement
              has:
                field: value
                matches: method-read
      # `['GET', 'HEAD']`.
      - inside:
          kind: array
          has:
            matches: method-token
      # `'GET' | 'HEAD'`.
      - inside:
          kind: literal_type
          inside:
            kind: union_type
            stopBy:
              not:
                kind: union_type
            has:
              stopBy: end
              matches: method-token
rule:
  any:
    - matches: method-token
    - all:
        - matches: any-case-method-token
        - matches: method-position
