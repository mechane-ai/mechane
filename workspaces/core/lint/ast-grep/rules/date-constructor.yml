# EF-17: time is read only with `DateTime.nowUnsafe()` and held as a `DateTime.Utc`; a `Date` reads the clock or parses
# text outside the one read a function passes down.
id: date-constructor
language: TypeScript
severity: error
message: 'Read the clock once and pass it down, such as `const now = DateTime.nowUnsafe()`, never `new Date()` (EF-17)'
files: ['packages/**/*.ts']
ignores:
  [
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    '**/node_modules/**',
    '**/*.d.ts',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/shared/bash/src/**',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/node/eval/src/environment/http-entry.ts',
    'packages/browser/elements/packages/forms/src/dates/civil.ts',
    'packages/worker/{runtime/src,server/src,control-store/src,sandbox/testing}/**',
  ]
rule:
  kind: new_expression
  has: { field: constructor, regex: ^Date$ }
