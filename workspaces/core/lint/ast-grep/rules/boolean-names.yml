# The util `boolean-prefix` carries the registry's predicate and option prefixes.
id: boolean-names
language: TypeScript
severity: error
message: "Start a boolean's name with a declared predicate or option prefix, such as `isPassed` or `includeArchived` (NM-07)"
files: ['**/*.ts']
ignores: ['**/node_modules/**']
utils:
  boolean-type:
    kind: type_annotation
    has:
      kind: predefined_type
      regex: ^boolean$
  boolean-value:
    any:
      - kind: 'true'
      - kind: 'false'
      - kind: unary_expression
        regex: ^!
      - kind: binary_expression
        has:
          field: operator
          regex: ^(===|!==|==|!=|<|>|<=|>=|instanceof|in)$
  boolean-schema:
    regex: ^(Schema\.optional\()?Schema\.Boolean
  boolean-literal:
    any:
      - kind: 'true'
      - kind: 'false'
  declared-object:
    kind: object
    inside:
      any:
        - kind: variable_declarator
        - kind: as_expression
        - kind: satisfies_expression
  unprefixed:
    not:
      matches: boolean-prefix
rule:
  any:
    - kind: property_signature
      all:
        - has:
            field: name
            matches: unprefixed
        - has:
            field: type
            matches: boolean-type
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: identifier
            matches: unprefixed
        - any:
            - has:
                field: type
                matches: boolean-type
            - has:
                field: value
                matches: boolean-value
    - kind: required_parameter
      all:
        - has:
            field: pattern
            kind: identifier
            matches: unprefixed
        - has:
            field: type
            matches: boolean-type
    - kind: pair
      all:
        - has:
            field: key
            matches: unprefixed
        - has:
            field: value
            matches: boolean-schema
    # A field of a class, or of an object a declaration names, such as `readonly #ready = true` or `{ ready: true }`.
    - kind: public_field_definition
      all:
        - has:
            field: name
            matches: unprefixed
        - any:
            - has:
                field: type
                matches: boolean-type
            - has:
                field: value
                matches: boolean-value
    - kind: pair
      inside:
        matches: declared-object
      all:
        - has:
            field: key
            kind: property_identifier
            matches: unprefixed
        - has:
            field: value
            matches: boolean-literal
