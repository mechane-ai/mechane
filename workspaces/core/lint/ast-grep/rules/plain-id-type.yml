# An id property typed as a plain string, which its entity's brand types instead.
id: plain-id-type
language: TypeScript
severity: error
message: "Type an id with its entity's brand from the protocol's records, such as `readonly turnId: TurnId` (TD-14)"
files: ['**/*.ts']
ignores:
  [
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/{runtime,server,control-store}/src/**',
    'packages/worker/sandbox/src/service/**',
    '**/node_modules/**',
    'packages/browser/console-data/src/conversation.ts',
    'packages/browser/console/src/conversations/entry.ts',
    'packages/browser/console/src/conversations/transport.ts',
    'packages/browser/elements/packages/**',
  ]
rule:
  kind: property_signature
  all:
    - has:
        field: name
        regex: (^id|Id|Ids)$
    - has:
        field: type
        any:
          - has:
              kind: predefined_type
              regex: ^string$
          - has:
              stopBy: end
              kind: type_arguments
              has:
                kind: predefined_type
                regex: ^string$
