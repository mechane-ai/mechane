# The authenticated compute service owns the sole Durable Object namespace.
id: object-name-outside-object-calls
language: TypeScript
severity: error
message: 'Name a sandbox only in its authenticated service boundary, such as `namespace.idFromName(name)` in `sandbox-service/src/settings.ts` (044)'
files: [packages/**/*.ts]
ignores: ['**/node_modules/**', packages/worker/sandbox/src/service/settings.ts]
rule:
  kind: property_identifier
  regex: ^(idFromName|idFromString|newUniqueId)$
