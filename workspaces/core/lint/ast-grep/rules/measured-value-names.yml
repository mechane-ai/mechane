# The utils `measure-word` and `unit-suffix` carry the registry's measure words, units and counted nouns.
id: measured-value-names
language: TypeScript
severity: error
message: 'End the name of a numeric limit or duration with a declared unit or counted noun, such as `timeoutMs` or `maxAttempts` (NM-08)'
files: ['**/*.ts']
ignores: ['**/node_modules/**']
utils:
  numeric-type:
    kind: type_annotation
    has:
      kind: predefined_type
      regex: ^number$
  numeric-value:
    any:
      - kind: number
      - kind: binary_expression
        has:
          field: operator
          regex: ^[-+*/%]$
  numeric-schema:
    regex: ^(Schema\.optional\()?Schema\.(Number|Int|Finite)
  declared-object:
    kind: object
    inside:
      any:
        - kind: variable_declarator
        - kind: as_expression
        - kind: satisfies_expression
  unitless:
    all:
      - matches: measure-word
      - not:
          matches: unit-suffix
rule:
  any:
    - kind: property_signature
      all:
        - has:
            field: name
            matches: unitless
        - has:
            field: type
            matches: numeric-type
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: identifier
            matches: unitless
        - any:
            - has:
                field: type
                matches: numeric-type
            - has:
                field: value
                matches: numeric-value
    - kind: required_parameter
      all:
        - has:
            field: pattern
            kind: identifier
            matches: unitless
        - has:
            field: type
            matches: numeric-type
    - kind: pair
      all:
        - has:
            field: key
            matches: unitless
        - has:
            field: value
            matches: numeric-schema
    # A field of a class, or of an object a declaration names, such as `readonly #timeout = 30` or `{ timeout: 30 }`.
    - kind: public_field_definition
      all:
        - has:
            field: name
            matches: unitless
        - any:
            - has:
                field: type
                matches: numeric-type
            - has:
                field: value
                matches: numeric-value
    - kind: pair
      inside:
        matches: declared-object
      all:
        - has:
            field: key
            kind: property_identifier
            matches: unitless
        - has:
            field: value
            matches: numeric-value
