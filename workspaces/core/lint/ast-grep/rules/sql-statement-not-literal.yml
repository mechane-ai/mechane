id: sql-statement-not-literal
language: TypeScript
severity: error
message: "Pass the SQL client one whole literal statement, such as `client.query('SELECT 1')` (DO-06)"
files: ['**/*.ts']
ignores:
  [
    '**/node_modules/**',
    packages/browser/console-cache/src/store/storage.ts,
    packages/node/runtime/src/store/database.ts,
    packages/node/runtime/src/store/grants.ts,
    packages/node/stack/src/postgres.ts,
  ]
rule:
  kind: call_expression
  all:
    - has:
        field: function
        any:
          - pattern: $CLIENT.exec
          - pattern: $CLIENT.prepare
          - pattern: $CLIENT.query
    - has:
        field: arguments
        has:
          nthChild: 1
          not:
            any:
              - kind: string
              - all:
                  - kind: template_string
                  - not:
                      has:
                        kind: template_substitution
constraints:
  CLIENT:
    regex: (^|\.)(sql|database|client|pool)$
