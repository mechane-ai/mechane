# EF-05 and TD-25: a failure is told apart by its tag, with `Match.valueTags` in a `retry` filter or `catchTags`, and a
# value by its schema; `instanceof` tests a class, which a decoded value or another realm's object fails.
id: no-instanceof
language: TypeScript
severity: error
message: 'Tell a failure by its tag, such as `while: Match.valueTags({ Unreachable: () => true })`, never with `instanceof` (EF-05)'
files: ['packages/**/*.ts']
ignores:
  [
    'packages/shared/protocol/src/presentation/**',
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    '**/node_modules/**',
    '**/*.d.ts',
    'packages/browser/console-data/src/api.ts',
    'packages/browser/console-data/src/browser-authentication.ts',
    'packages/browser/console-data/src/scope-invalidation.ts',
    'packages/browser/console-data/src/read-recovery.ts',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/shared/bash/src/**',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/node/eval/src/environment/http-entry.ts',
    'packages/worker/{runtime/src,server/src,control-store/src,sandbox/testing}/**',
  ]
rule:
  kind: binary_expression
  has: { field: operator, regex: ^instanceof$ }
