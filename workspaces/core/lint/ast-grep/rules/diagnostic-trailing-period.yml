id: diagnostic-trailing-period
language: TypeScript
severity: error
message: "End the diagnostic without a period, such as `reason: 'the file is missing'` (ER-11)"
files: ['**/*.ts']
ignores: ['**/node_modules/**']
rule:
  all:
    - any:
        - kind: string
        - kind: template_string
    - regex: "\\.['\"`]$"
    - inside:
        kind: pair
        has:
          field: key
          any:
            - regex: ^(line|diagnostic|detail|issue|reason)$
            - all:
                - regex: ^message$
                - inside:
                    stopBy: end
                    any:
                      - kind: new_expression
                      - kind: call_expression
                        has:
                          field: function
                          regex: '^(logger|log|console)\.(debug|info|warn|error|log)$'
