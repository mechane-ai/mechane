# A `_tag` property type or value written by hand, which a schema's tagged union and its constructors replace.
id: hand-written-tag
language: TypeScript
severity: error
message: 'Declare a tagged union with `Schema.TaggedUnion` and build a member with its constructor, such as `Answer.cases.Settled.make({ receipt })` (TD-20)'
files: ['**/*.ts']
ignores:
  [
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/{runtime,server,control-store}/src/**',
    'packages/worker/sandbox/src/service/**',
    'packages/shared/protocol/src/presentation/**',
    '**/node_modules/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
  ]
rule:
  any:
    - kind: property_signature
      has:
        field: name
        regex: ^_tag$
    - kind: pair
      has:
        field: key
        regex: ^_tag$
