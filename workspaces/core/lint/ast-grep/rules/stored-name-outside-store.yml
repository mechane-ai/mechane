# A stored name outside the store that owns it: a table the migrations create, named in SQL text, or a stored file.
# Only SQL positions count, so a word that is also a table's name, such as the guest's `machines` route segment, is no
# stored name. The owned check `locks` fails when the table list differs from the tables the migrations create.
id: stored-name-outside-store
language: TypeScript
severity: error
message: 'Name a table or a stored file only in the store module that owns it, such as `turnStore.listTurns({ mechId })` here (DO-06)'
files: [packages/**/*.ts]
# The registry owns this rule's violation fixtures; those strings are not application storage accesses.
ignores:
  [
    '**/node_modules/**',
    '**/store/**',
    '**/*-store/**',
    packages/node/smoke/**,
    packages/node/testing/**,
    packages/node/rules/src/contracts/program-rules/data/data-store-ownership.ts,
  ]
rule:
  kind: string_fragment
  any:
    - regex: \b(FROM|INTO|UPDATE|JOIN|TABLE|EXISTS|ON)\s+(?:mechane\.)?(activation_checkpoints|activity|api_keys|audit_events|auth_attempts|browser_calls|browser_machine|browser_sessions|browser_tabs|console_messages|credentials|device_approvals|evidence_artifacts|evidence_chunks|execution_access|execution_cancellations|execution_receipts|executions|file_checkpoint_results|identities|inputs|interactive_run_cancellations|machine_drains|machines|managed_processes|mcp_connections|mcp_grants|mech_mailboxes|mech_revisions|mechs|memberships|memories|messages|notifications|oauth_states|portable_maintenance|principals|request_events|request_waits|runs|sandbox_activity|sandbox_capacity|sandbox_completions|sandbox_workspace|schema_migrations|session_contexts|sessions|slack_bindings|slack_deliveries|slack_inbound_events|slack_installations|spend_reservations|tool_dispatches|work_items|workspace_retirements|workspaces)\b
    - regex: ^(credentials\.json|lock\.json|plan\.json|report\.json|subject-intent\.json|subject\.json|grader-intent\.json|grade\.json)$
