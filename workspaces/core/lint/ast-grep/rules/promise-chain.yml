# Outside `utilities`, a promise is awaited rather than chained: no `.catch` with a named handler, `.finally`,
# `Promise.resolve`, `new Promise` or `.then` on a `.then`. A capitalized object's `catch`, such as `Effect.catch`, is no
# promise's, and catch-handlers-typescript, which contract 024 ships, rejects a `.catch` whose handler is written inline.
id: promise-chain
language: TypeScript
severity: error
message: 'Await each promise in an async function rather than chain it, such as `const answer = await call()` in place of `call().then(read).then(use)` (DO-03)'
files: ['**/*.ts']
ignores:
  [
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    '**/node_modules/**',
    '**/utilities/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/worker/{agent-slot/src,authority-store/src,managed-store/src,runtime/src,server/src,control-store/src,sandbox/testing}/**',
    'packages/node/{stack,distribution,testing,smoke,sandbox-docker,worker-agent}/src/**',
    'packages/shared/{bash,sandbox-provider,sandbox-tensorlake,sandbox-modal}/src/**',
    'packages/worker/server/testing/sandbox-providers.ts',
  ]
rule:
  any:
    - pattern: $PROMISE.finally($$$ARGS)
    - pattern: Promise.resolve($$$ARGS)
    - pattern: new Promise($$$ARGS)
    - pattern: new Promise<$TYPE>($$$ARGS)
    - pattern: $PROMISE.then($$$FIRST).then($$$SECOND)
    - all:
        - pattern: $PROMISE.catch($$$ARGS)
        - not:
            has:
              field: function
              has:
                field: object
                regex: ^[A-Z]
        - not:
            has:
              field: arguments
              has:
                any:
                  - kind: arrow_function
                  - kind: function_expression
