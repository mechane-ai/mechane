# Every executable `main.ts` and the Worker module the runtime loads run Effects; elsewhere one composes with `yield*`.
id: effect-run-at-entry
language: TypeScript
severity: error
message: 'Compose the Effect with `yield*` and run it only at an entry point, such as `const row = yield* readRow(input)` (EF-12)'
files: ['**/*.ts']
ignores:
  [
    'packages/worker/server/src/main.ts',
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/{runtime,server,control-store}/src/**',
    'packages/worker/sandbox/src/service/**',
    '**/node_modules/**',
    '**/main.ts',
    packages/worker/sandbox-service/src/main.ts,
    'packages/browser/console-data/src/api.ts',
    'packages/browser/console-data/src/browser-authentication.ts',
    'packages/browser/console-data/src/scope-invalidation.ts',
    'packages/browser/console-data/src/read-recovery.ts',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/shared/bash/src/**',
  ]
rule:
  pattern: Effect.$RUN
constraints:
  RUN:
    regex: ^run
