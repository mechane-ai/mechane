# code-typescript-effect-errors: await a promise and bind its value, never chain it with its then or finally method.
# TypeScript variant (.ts, .mts, .cts); promise-chains-tsx.yml is identical except for `id`, `language`, and this line.
id: promise-chains-typescript
language: TypeScript
files: ['**/*.ts']
ignores:
  [
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    'packages/shared/presentation/src/**',
    'packages/browser/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/node/{stack,distribution,testing,smoke,sandbox-docker,worker-agent}/src/**',
    'packages/shared/{bash,sandbox-provider,sandbox-tensorlake,sandbox-modal}/src/**',
    'packages/worker/server/testing/sandbox-providers.ts',
    'packages/worker/{agent-slot/src,authority-store/src,managed-store/src,model-gateway/src,runtime,server/src,control-store/src,sandbox/testing,sandbox-egress/testing}/**',
  ]
severity: error
message: 'Await the promise, such as `const response = await fetch(url)` (ER-04)'
note: |
  Where a promise remains, such as at an entry point or in a function that `Effect.tryPromise` calls, await it, such as `const response = await fetch(INVOICE_URL, { signal })`.
  Release a resource after an awaited call with a `try` statement that has only a `finally` clause, never with the promise's `finally` method.
  The rule reports each call of a method named `then` or `finally`; catch-handlers reports a promise's `catch` method.
rule:
  # `readInvoice({ id }).then((invoice) => sumTotal({ invoice }))` and `readInvoice({ id }).finally(() => release())`, including after `?.`.
  kind: call_expression
  has:
    field: function
    kind: member_expression
    has:
      field: property
      regex: ^(then|finally)$
