# Only an entry point re-exports; every other file exports each declaration where it declares it.
id: entry-point-re-exports
language: TypeScript
severity: error
message: 'Export the declaration where it is declared, such as `export function parseLine(input)`, and re-export only from an entry point (ST-10)'
files: ['**/*.ts']
ignores:
  [
    'packages/node/runtime/src/channels/index.ts',
    'packages/shared/protocol/src/presentation/index.ts',
    '**/node_modules/**',
    'packages/**/src/index.ts',
    'packages/browser/elements/packages/**/index.ts',
    packages/browser/elements/packages/content/src/link.ts,
    packages/browser/elements/packages/foundations/src/tokens.ts,
    packages/worker/sandbox-service/src/main.ts,
  ]
rule:
  kind: export_statement
  any:
    - has:
        field: source
        kind: string
    - has:
        kind: export_clause
