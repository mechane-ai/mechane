# Only an entry point re-exports; every other file exports each declaration where it declares it.
id: entry-point-re-exports
language: TypeScript
severity: error
message: 'Export the declaration where it is declared, such as `export function parseLine(input)`, and re-export only from an entry point (ST-10)'
files: ['**/*.ts']
ignores:
  [
    '**/node_modules/**',
    'packages/**/src/index.ts',
    packages/browser/ui/packages/content/src/code/index.ts,
    packages/browser/ui/packages/content/src/diff/index.ts,
    packages/browser/ui/packages/content/src/tree/index.ts,
    packages/browser/ui/packages/content/src/link.ts,
    packages/browser/ui/packages/charts/src/cartesian/index.ts,
    packages/browser/ui/packages/charts/src/distribution/index.ts,
    packages/browser/ui/packages/charts/src/matrix/index.ts,
    packages/browser/ui/packages/charts/src/graph/index.ts,
    packages/worker/app/src/worker.ts,
  ]
rule:
  kind: export_statement
  any:
    - has:
        field: source
        kind: string
    - has:
        kind: export_clause
