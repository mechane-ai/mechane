# The Worker's settings module is the one reader of its bindings and variables.
id: raw-binding-read
language: TypeScript
severity: error
message: "Read a binding only in the Worker's settings module and pass the decoded settings, such as `settings.origin` (ST-31)"
files: [packages/worker/**/*.ts]
ignores:
  [
    '**/node_modules/**',
    packages/worker/sandbox/src/service/settings.ts,
    packages/worker/server/src/settings/worker.ts,
    packages/worker/sandbox/src/providers/sandbox-settings.ts,
    'packages/worker/server/src/import/settings.ts',
    'packages/node/cli/src/settings/load-invocation.ts',
    'packages/worker/runtime/src/config.ts',
    'packages/worker/server/src/settings/environment.ts',
    'packages/node/stack/src/settings.ts',
    'packages/node/smoke/src/settings.ts',
    'packages/node/stack/src/dev/settings.ts',
    'packages/node/testing/src/cli/start-cli.ts',
    'packages/worker/sandbox/src/service/machine-settings.ts',
    'packages/node/guest/src/load-guest-settings.ts',
    'packages/node/release/src/load-release-settings.ts',
    'packages/node/distribution/src/load-distribution-settings.ts',
    'packages/node/distribution/testing/shipped-formats.ts',
    'packages/node/checks/src/load-checks-settings.ts',
    'packages/node/rename/src/load-rename-settings.ts',
    'packages/node/rule-generator/src/load-generate-settings.ts',
  ]
rule:
  any:
    - kind: member_expression
      has:
        field: object
        regex: ^(env|environment|this\.env)$
    - kind: variable_declarator
      has:
        field: value
        regex: ^(env|environment|this\.env)$
