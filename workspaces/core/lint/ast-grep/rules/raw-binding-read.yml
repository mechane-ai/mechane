# The Worker's settings module is the one reader of its bindings and variables.
id: raw-binding-read
language: TypeScript
severity: error
message: "Read a binding only in the Worker's settings module and pass the decoded settings, such as `settings.origin` (ST-31)"
files: [packages/worker/**/*.ts]
ignores:
  [
    '**/node_modules/**',
    packages/worker/sandbox/src/service/settings.ts,
    packages/worker/server/src/settings/worker.ts,
    packages/worker/sandbox/src/providers/sandbox-settings.ts,
  ]
rule:
  any:
    - kind: member_expression
      has:
        field: object
        regex: ^(env|environment|this\.env)$
    - kind: variable_declarator
      has:
        field: value
        regex: ^(env|environment|this\.env)$
