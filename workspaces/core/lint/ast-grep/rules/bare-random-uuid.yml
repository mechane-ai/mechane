# A random UUID made outside its entity's brand, so no type says which kind of id it is.
id: bare-random-uuid
language: TypeScript
severity: error
message: 'Make a new id through its brand, such as `TurnId.make(crypto.randomUUID())` (TD-14)'
files: ['**/*.ts']
ignores:
  [
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/{runtime,server,control-store}/src/**',
    'packages/worker/sandbox/src/service/**',
    '**/node_modules/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/shared/bash/src/**',
    'packages/worker/sandbox/src/providers/machine-object.ts',
  ]
rule:
  any:
    - pattern: crypto.randomUUID()
    - pattern: randomUUID()
  not:
    inside:
      kind: arguments
      inside:
        kind: call_expression
        has:
          field: function
          regex: ^[A-Z]\w*Id\.make$
