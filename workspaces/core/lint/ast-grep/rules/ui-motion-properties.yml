id: ui-motion-properties
language: Tsx
severity: error
message: 'Name only opacity and transform, such as `transitionProperty: "opacity, transform"` (073)'
files: ['packages/browser/ui/src/**/*.ts', 'packages/browser/ui/src/**/*.tsx']
rule:
  kind: pair
  any:
    - all:
        - has:
            field: key
            regex: ^['"]?transition['"]?$
        - has:
            field: value
            kind: string
    - all:
        - has:
            field: key
            regex: ^['"]?transitionProperty['"]?$
        - not:
            has:
              field: value
              regex: ^['"](opacity|transform)(,\s*(opacity|transform))*['"]$
