# `??` and `?.`, which test for `null` and `undefined` where an `Option` holds absence.
id: nullish-operator
language: TypeScript
severity: error
message: 'Read an absent value through `Option`, such as `Option.getOrElse(Option.fromNullishOr(value), () => fallback)` (TD-18)'
files: ['**/*.ts']
ignores:
  [
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    'packages/shared/presentation/src/**',
    '**/node_modules/**',
    'packages/browser/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/worker/{agent-slot/src,authority-store/src,managed-store/src,runtime/src,server/src,control-store/src,sandbox/testing}/**',
    'packages/node/{stack,distribution,testing,smoke,sandbox-docker,worker-agent}/src/**',
    'packages/shared/{bash,sandbox-provider,sandbox-tensorlake,sandbox-modal}/src/**',
    'packages/worker/server/testing/sandbox-providers.ts',
  ]
rule:
  any:
    - kind: binary_expression
      has:
        field: operator
        regex: ^\?\?$
    - kind: optional_chain
