# Money, token counts, sizes and log positions held as plain numbers, which their unit brands type instead.
id: raw-money-number
language: TypeScript
severity: error
message: "Type a measured value with its unit's brand, such as `readonly costMicros: Micros` (TD-15)"
files: ['**/*.ts']
ignores:
  [
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/{runtime,server,control-store}/src/**',
    'packages/worker/sandbox/src/service/**',
    'packages/shared/protocol/src/presentation/**',
    '**/node_modules/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/shared/bash/src/**',
    'packages/worker/sandbox/src/providers/machine-object.ts',
  ]
utils:
  unit-name:
    regex: (Micros|Tokens|Bytes|Chars|^sequence|Sequence)$
rule:
  any:
    - kind: property_signature
      all:
        - has:
            field: name
            matches: unit-name
        - has:
            field: type
            has:
              kind: predefined_type
              regex: ^number$
    - kind: pair
      all:
        - has:
            field: key
            matches: unit-name
        - has:
            field: value
            any:
              - regex: ^Schema\.(Int|Number|Finite|NonNegativeInt)$
              - has:
                  stopBy: end
                  regex: ^Schema\.(Int|Number|Finite|NonNegativeInt)$
