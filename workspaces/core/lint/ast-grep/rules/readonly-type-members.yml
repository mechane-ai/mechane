# A property signature without `readonly`, in a type alias or an object type; a property-style method is one too.
id: readonly-type-members
language: TypeScript
severity: error
message: 'Make the property read-only, such as `readonly turnId: TurnId` (TD-06)'
files: ['**/*.ts']
ignores: ['**/node_modules/**']
rule:
  kind: property_signature
  not:
    any:
      - regex: '^readonly\b'
      - inside:
          stopBy: end
          kind: type_annotation
          inside:
            kind: variable_declarator
            has: { field: value, kind: object }
            inside:
              kind: lexical_declaration
              regex: '^const\b'
              inside:
                stopBy: end
                kind: statement_block
                inside: { matches: function-boundary }
