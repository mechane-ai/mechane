# An object type literal stands only as a `type` alias's whole value, or as the one object literal of an intersection
# that is the alias's value, beside named types, such as `type ReadInput = PageInput & { readonly line: string }` (TD-03).
id: named-object-types
language: TypeScript
severity: error
message: 'Name the object type with a `type` alias, such as `type LineInput = { readonly line: string }` (TD-03)'
files: ['**/*.ts']
ignores:
  [
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    'packages/shared/protocol/src/presentation/**',
    '**/node_modules/**',
    'packages/browser/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/shared/bash/src/**',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/node/eval/src/environment/http-entry.ts',
    'packages/worker/{runtime/src,server/src,control-store/src,sandbox/testing}/**',
  ]
utils:
  # an intersection's operand that is an object type literal, or an intersection holding one
  intersected-object:
    any:
      - kind: object_type
      - kind: intersection_type
        has:
          stopBy: { not: { kind: intersection_type } }
          kind: object_type
rule:
  kind: object_type
  any:
    - not:
        inside:
          stopBy: { not: { kind: intersection_type } }
          kind: type_alias_declaration
    # a second object literal of the alias's intersection
    - all:
        - inside: { kind: intersection_type }
        - follows: { stopBy: end, matches: intersected-object }
