# An id field decoded as plain text or a bare record id, which its entity's branded schema decodes instead.
id: plain-id-schema
language: TypeScript
severity: error
message: "Decode an id with its entity's branded schema from the protocol's records, such as `turnId: TurnId` (TD-14)"
files: ['**/*.ts']
ignores:
  [
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    '**/node_modules/**',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/node/{stack,distribution,testing,smoke,sandbox-docker,worker-agent}/src/**',
    'packages/shared/{bash,sandbox-provider,sandbox-tensorlake,sandbox-modal}/src/**',
    'packages/worker/server/testing/sandbox-providers.ts',
    'packages/worker/{agent-slot/src,authority-store/src,managed-store/src,model-gateway/src,runtime,server/src,control-store/src,sandbox/testing,sandbox-egress/testing}/**',
  ]
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: (^id|Id|Ids)$
    - has:
        field: value
        any:
          - regex: ^(Schema\.String|RecordId|RandomId)$
          - has:
              stopBy: end
              regex: ^(Schema\.String|RecordId|RandomId)$
