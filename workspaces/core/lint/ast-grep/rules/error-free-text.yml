# Tagged errors derive messages from structured fields. Codes and operations use closed enums; URL and timeout
# fields retain their native types. `tagged-error-cause` refuses `cause`.
id: error-free-text
language: TypeScript
severity: error
message: "Give a tagged error ids, closed-set members and measured values and a dependency's text as `reason`, such as `{ mechId: MechId, reason: Schema.String }` (ER-02)"
files: ['**/*.ts']
ignores: ['**/node_modules/**']
utils:
  error-fields:
    kind: object
    inside:
      kind: arguments
      inside:
        kind: call_expression
        has:
          field: function
          kind: call_expression
          regex: ^Schema\.TaggedError
rule:
  kind: pair
  inside:
    matches: error-fields
  any:
    - has:
        field: key
        regex: ^(message|issue|detail)$
    - all:
        - has:
            field: key
            regex: ^(code|operation)$
        - not:
            has:
              field: value
              kind: call_expression
              has:
                field: function
                regex: ^Schema\.Enum$
    - all:
        - has:
            field: key
            regex: ^(url|\w*[tT]imeout\w*)$
        - has:
            field: value
            regex: ^Schema\.String$
