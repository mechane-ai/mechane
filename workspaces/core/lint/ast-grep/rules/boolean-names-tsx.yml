# Generated from @mechane/rules by `mise run fix`; change the registry, never this file.
# Matcher source: lint/ast-grep/rules/boolean-names.yml.
# The util `boolean-prefix` carries the registry's predicate and option prefixes.
id: boolean-names-tsx
language: Tsx
severity: error
message: "Start a boolean's name with a declared predicate or option prefix, such as `isPassed` or `includeArchived` (NM-07)"
files: ['packages/browser/**/*.tsx']
ignores: ['**/node_modules/**']
utils:
  boolean-type:
    kind: type_annotation
    any:
      - has:
          kind: predefined_type
          regex: ^boolean$
      - has:
          kind: literal_type
          regex: ^(true|false)$
      - has:
          kind: union_type
          regex: ^(?:\s*(?:boolean|true|false|null|undefined)\s*\|)*\s*(?:boolean|true|false|null|undefined)\s*$
          has:
            any:
              - kind: predefined_type
                regex: ^boolean$
              - kind: literal_type
                regex: ^(true|false)$
            stopBy: end
  boolean-value:
    any:
      - kind: 'true'
      - kind: 'false'
      - kind: unary_expression
        regex: ^!
      - kind: binary_expression
        has:
          field: operator
          regex: ^(===|!==|==|!=|<|>|<=|>=|instanceof|in)$
  boolean-schema:
    regex: ^(Schema\.optional\()?Schema\.Boolean
  boolean-literal:
    any:
      - kind: 'true'
      - kind: 'false'
  declared-object:
    kind: object
    inside:
      any:
        - kind: variable_declarator
        - kind: as_expression
        - kind: satisfies_expression
  unprefixed:
    not:
      any:
        - matches: boolean-prefix-tsx
        - all:
            - regex: ^['"]?no_bundle['"]?$
            - inside:
                kind: property_signature
                field: name
                inside:
                  kind: type_alias_declaration
                  has:
                    field: name
                    regex: ^BuiltBundle$
                  stopBy: end
        - all:
            - matches: native-boolean-name-tsx
            - inside:
                kind: property_signature
                field: name
                inside:
                  any:
                    - kind: type_alias_declaration
                    - kind: interface_declaration
                  has:
                    field: name
                    regex: (Props|Properties)$
                  stopBy: end
        - all:
            - matches: native-boolean-name-tsx
            - inside:
                kind: required_parameter
                field: pattern
                inside:
                  kind: property_signature
                  has:
                    field: name
                    regex: ^on[A-Z]
                  stopBy: end
        - all:
            - matches: keyboard-modifier-name-tsx
            - inside:
                kind: property_signature
                field: name
                inside:
                  kind: type_alias_declaration
                  has:
                    field: name
                    regex: ^CommandShortcut$
                  stopBy: end
rule:
  any:
    - kind: property_signature
      all:
        - has:
            field: name
            matches: unprefixed
        - has:
            field: type
            matches: boolean-type
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: identifier
            matches: unprefixed
        - any:
            - has:
                field: type
                matches: boolean-type
            - has:
                field: value
                matches: boolean-value
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: array_pattern
            has:
              kind: identifier
              nthChild: 1
              matches: unprefixed
        - has:
            field: value
            kind: call_expression
            all:
              - has:
                  field: function
                  regex: ^(React[.])?useState$
              - has:
                  field: arguments
                  has:
                    matches: boolean-literal
    - kind: required_parameter
      all:
        - has:
            field: pattern
            kind: identifier
            matches: unprefixed
        - any:
            - has:
                field: type
                matches: boolean-type
            - has:
                field: value
                matches: boolean-literal
    - kind: pair
      all:
        - has:
            field: key
            matches: unprefixed
        - has:
            field: value
            matches: boolean-schema
    # A field of a class, or of an object a declaration names, such as `readonly #ready = true` or `{ ready: true }`.
    - kind: public_field_definition
      all:
        - has:
            field: name
            matches: unprefixed
        - any:
            - has:
                field: type
                matches: boolean-type
            - has:
                field: value
                matches: boolean-value
    - kind: pair
      inside:
        matches: declared-object
      all:
        - has:
            field: key
            kind: property_identifier
            matches: unprefixed
        - has:
            field: value
            matches: boolean-literal
