id: owned-class
language: TypeScript
severity: error
message: 'Write a factory function instead of a class, such as `makeStack({ settings })`, unless the runtime or a tagged error needs one (020)'
files: ['**/*.ts']
ignores: ['**/node_modules/**']
rule:
  any:
    - kind: abstract_class_declaration
    - all:
        - any:
            - kind: class_declaration
            - kind: class
        - not:
            has:
              kind: class_heritage
              has:
                any:
                  - kind: extends_clause
                    has:
                      field: value
                      regex: ^(DurableObject|WorkerEntrypoint|Error$|Data\.TaggedError|Schema\.TaggedError<)
                  - kind: implements_clause
                    has:
                      kind: type_identifier
                      regex: ^LanguageModelV4$
