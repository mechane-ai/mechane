# TD-19: a closed set is declared once, as an `as const` object, and its schemas read its members; a literal written in
# `Schema.Literal` or `Schema.Literals` declares the set a second time.
id: raw-literal-schema
language: TypeScript
severity: error
message: "Read a closed set through its members, such as `Schema.Literal(DeviceStep.Approve)` or `Schema.Enum(DeviceStep)`, never `Schema.Literal('approve')` (TD-19)"
files: ['packages/**/*.ts']
ignores:
  [
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/sandbox/src/service/**',
    'packages/shared/presentation/src/**',
    '**/node_modules/**',
    '**/*.d.ts',
    'packages/node/program/src/{start-process,finished-process,types}.ts',
    'packages/node/guest/src/guest-listener.ts',
    'packages/worker/sandbox/src/providers/machine-object.ts',
    'packages/node/{stack,distribution,testing,smoke,sandbox-docker,worker-agent}/src/**',
    'packages/shared/{bash,sandbox-provider,sandbox-tensorlake,sandbox-modal}/src/**',
    'packages/worker/server/testing/sandbox-providers.ts',
    'packages/worker/{agent-slot/src,authority-store/src,managed-store/src,model-gateway/src,runtime/src,server/src,control-store/src,sandbox/testing,sandbox-egress/testing}/**',
  ]
rule:
  kind: call_expression
  all:
    - has: { field: function, regex: ^Schema\.(Literal|Literals)$ }
    - has:
        { field: arguments, has: { stopBy: end, any: [{ kind: string }, { kind: number }, { kind: template_string }] } }
