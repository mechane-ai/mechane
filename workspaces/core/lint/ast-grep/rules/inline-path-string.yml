# SC-10: a template literal that forms a path, URL, key or query is the whole return value of a builder function named
# for what it builds, such as `guestExecutionPath({ machineId, executionId })`.
id: inline-path-string
language: TypeScript
severity: error
message: 'Build the path in one named builder that takes its parts as fields, such as `guestExecutionPath({ machineId, executionId })` (SC-10)'
files: ['**/*.ts']
ignores:
  [
    '**/node_modules/**',
    '**/*.d.ts',
    'packages/node/{stack,distribution,testing,smoke}/src/**',
    'packages/shared/deployment/src/worker-deployment.ts',
    'packages/worker/{runtime,server,control-store}/src/**',
    'packages/worker/sandbox/src/service/**',
    packages/worker/sandbox-service/src/**,
  ]
utils:
  path-like:
    all:
      - kind: template_string
      - has: { kind: template_substitution }
      - regex: '^`(/|https?://|\$\{[^}]+\}/|\$\{[^}]+\}:)|/\$\{|\$\{[^}]+\}/|\?[a-z_]+=|&[a-z_]+='
      - not: { regex: '\s' }
  colon-piece: { kind: string, regex: '^[''"]:[''"]$' }
rule:
  any:
    - all:
        - matches: path-like
        - not: { matches: path-builder-return }
    # `+` never forms such a string, not even in a builder
    - matches: path-concatenation
    - all:
        - kind: binary_expression
        - has: { field: operator, regex: '^\+$' }
        - any:
            - has: { field: left, matches: colon-piece }
            - has: { field: right, matches: colon-piece }
