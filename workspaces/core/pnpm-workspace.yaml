packages:
  - packages/*
  - packages/node/*
  - packages/worker/*
  - packages/shared/*
  - packages/browser/*

# pnpm holds back releases younger than its minimum release age; these are the exact releases this workspace pins.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@1.5.1'
  - '@earendil-works/pi-durable@1.5.1'
  - '@earendil-works/pi-schema@1.5.1'
  - '@earendil-works/chord@1.5.1'
  - effect@4.0.7
  - miniflare@5.20261023.2-beta
  - wrangler@4.155.0
  - '@cloudflare/workers-types@5.20261028.1'
  - '@tanstack/query-core@5.105.2'
  - '@vitejs/plugin-react@6.2.1'
  - '@pierre/diffs@1.6.4'
  - '@tanstack/react-virtual@3.14.26'
  - '@tanstack/virtual-core@3.19.11'
  - react-resizable-panels@4.18.0
  - '@tanstack/browser-db-sqlite-persistence@1.0.0-rc.1.4'
  - '@tanstack/db-sqlite-persistence-core@1.0.0-rc.1.4'
  - '@tanstack/db@1.0.0-rc.1.4'
  - '@tanstack/react-db@1.0.0-rc.1.4'
  - '@ai-sdk/gateway@4.0.137'
  - '@ai-sdk/mcp@2.0.92'
  - '@ai-sdk/workflow@2.0.96'
  - ai@7.0.164
  - hono@4.13.17
  - '@ai-sdk/react@4.0.168'
  - '@earendil-works/pi-codemode@1.5.1'
  - '@earendil-works/pi-telemetry@1.5.1'

# These install scripts place each tool's platform binary; swc's binary arrives as an optional package instead, and
# pi-ai's Google and protobuf dependencies need no script for the one OpenAI-compatible API the Worker loads.
# Native browser persistence ships its SQLite Worker and WASM; the optional PowerSync download is unused.
allowBuilds:
  '@ast-grep/cli': true
  '@google/genai': false
  '@journeyapps/wa-sqlite': false
  '@swc/core': false
  cbor-extract: true
  esbuild: true
  protobufjs: false
  workerd: true
