name: Publish UI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mechane-ai/mechane' && startsWith(github.event.release.tag_name, 'ui-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Put the bootstrap's tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the pinned mise, tools and locked packages
        run: .config/bootstrap.sh
      - name: Rebuild the reviewed archive and publish through npm trust
        run: mise exec -- node .config/ui-npm.mts "$RUNNER_TEMP/mechane-ui"
