name: Publish Elements
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-elements-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mechane-ai/mechane' && startsWith(github.event.release.tag_name, 'elements-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Read the reviewed mise release
        id: mise-release
        run: |
          source .config/mise-release.sh
          echo "version=$(mise_release_version)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(mise_release_digest linux-x64)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/bootstrap-mise
        id: mise-bootstrap
        with:
          version: ${{ steps.mise-release.outputs.version }}
          sha256: ${{ steps.mise-release.outputs.sha256 }}
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: ${{ steps.mise-bootstrap.outputs.version }}
          mise_dir: ${{ steps.mise-bootstrap.outputs.directory }}
          sha256: ${{ steps.mise-bootstrap.outputs.sha256 }}
          install: false
          cache: false
      - name: Put the bootstrap's tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the pinned mise, tools and locked packages
        run: .config/bootstrap.sh
      - name: Rebuild the reviewed archive and publish through npm trust
        run: mise exec -- node .config/elements-npm.mts "$RUNNER_TEMP/mechane-elements"
