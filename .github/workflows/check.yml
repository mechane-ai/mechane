name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # mise installs from the URLs mise.lock records; the read-only token raises the API limit for any other lookup.
      GITHUB_TOKEN: ${{ github.token }}
      # The owned checks hold each ratchet's baseline to the one at the merge base with the branch a pull request
      # targets, or with main otherwise.
      MECHANE_BASE_BRANCH: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The full history holds the merge base the baselines are compared with.
          fetch-depth: 0
      - name: Read the reviewed mise release
        id: mise-release
        run: |
          source .config/mise-release.sh
          echo "version=$(mise_release_version)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(mise_release_digest linux-x64)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/bootstrap-mise
        id: mise-bootstrap
        with:
          version: ${{ steps.mise-release.outputs.version }}
          sha256: ${{ steps.mise-release.outputs.sha256 }}
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: ${{ steps.mise-bootstrap.outputs.version }}
          mise_dir: ${{ steps.mise-bootstrap.outputs.directory }}
          sha256: ${{ steps.mise-bootstrap.outputs.sha256 }}
          install: false
          cache: false
      - name: Put the bootstrap's tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the pinned mise, tools and locked packages
        run: .config/bootstrap.sh
      - name: Set up the candidate image store
        if: github.repository == 'mechane-ai/mechane'
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          version: v29.8.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Set up the candidate image builder
        if: github.repository == 'mechane-ai/mechane'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Check private source
        if: github.repository != 'mechane-ai/mechane'
        run: mise run check:static
      - name: Check public repository guidance
        if: github.repository == 'mechane-ai/mechane'
        run: mise run contracts:check repository:check
      - name: Build and qualify one public candidate
        if: github.repository == 'mechane-ai/mechane'
        run: mise -C workspaces/core run distribution:candidate
      - name: Retain the qualified candidate for promotion
        if: github.repository == 'mechane-ai/mechane'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-candidate-${{ github.sha }}
          path: workspaces/core/dist/distribution/v*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Print retained local service logs after a failed smoke
        if: failure()
        run: |
          shopt -s nullglob
          for log in "${TMPDIR:-/tmp}"/mechane-node-stack-*/*.log \
            "${TMPDIR:-/tmp}"/mechane-node-stack-*/application/.celld/{celld,build}.log \
            "${TMPDIR:-/tmp}"/mechane-node-stack-*/sandbox/.celld/celld.log \
            "${TMPDIR:-/tmp}"/mechane-node-failure-*/*.log; do
            echo "== $log"
            tail -n 80 "$log"
          done
