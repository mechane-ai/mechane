name: Build runtime candidate
run-name: Runtime candidate ${{ inputs.source_commit }}
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full public source commit; must match the selected workflow ref
        required: true
        type: string
      reuse_guest_release:
        description: Existing runtime release tag for verified guest reuse, paired with its qualification SHA-256
        required: false
        type: string
      reuse_guest_qualification_sha256:
        description: Exact qualification.json SHA-256 for the selected existing guest release
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: runtime-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'mechane-ai/mechane'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MECHANE_BASE_BRANCH: origin/main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the selected source before building
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          reject_source() {
            printf '::error::%s\n' "$1"
            exit 1
          }
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || reject_source 'Use the complete 40-character lowercase source commit.'
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA" || reject_source 'The selected workflow ref differs from the reviewed source. Select a branch or tag at that commit.'
          checkout_commit=$(git rev-parse HEAD) || reject_source 'Could not read the checked-out commit.'
          test "$checkout_commit" = "$EXPECTED_COMMIT" || reject_source 'The checkout differs from the reviewed source commit.'
          checkout_changes=$(git status --porcelain) || reject_source 'Could not inspect the candidate checkout.'
          test -z "$checkout_changes" || reject_source 'The candidate checkout contains local changes before setup.'
      - name: Validate the qualified guest selection
        env:
          REUSE_GUEST_RELEASE: ${{ inputs.reuse_guest_release }}
          REUSE_GUEST_QUALIFICATION_SHA256: ${{ inputs.reuse_guest_qualification_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$REUSE_GUEST_RELEASE" && -z "$REUSE_GUEST_QUALIFICATION_SHA256" ]]; then
            exit 0
          fi
          if [[ -z "$REUSE_GUEST_RELEASE" || -z "$REUSE_GUEST_QUALIFICATION_SHA256" ]]; then
            printf '::error::Select both an existing guest release and its qualification SHA-256.\n'
            exit 1
          fi
          if [[ ! "$REUSE_GUEST_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf '::error::Use a runtime release tag such as v0.33.1.\n'
            exit 1
          fi
          if [[ ! "$REUSE_GUEST_QUALIFICATION_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf '::error::Use the complete 64-character lowercase qualification SHA-256.\n'
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Download the selected qualified guest
        id: guest
        if: inputs.reuse_guest_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_GUEST_RELEASE: ${{ inputs.reuse_guest_release }}
          REUSE_GUEST_QUALIFICATION_SHA256: ${{ inputs.reuse_guest_qualification_sha256 }}
        run: |
          set -euo pipefail
          guest_directory="$RUNNER_TEMP/mechane-qualified-guest"
          mkdir "$guest_directory"
          gh release download "$REUSE_GUEST_RELEASE" \
            --repo "github.com/$GITHUB_REPOSITORY" \
            --dir "$guest_directory"
          printf '%s  %s\n' "$REUSE_GUEST_QUALIFICATION_SHA256" "$guest_directory/qualification.json" | sha256sum -c
          printf 'directory=%s\n' "$guest_directory" >> "$GITHUB_OUTPUT"
      - name: Set up the candidate image store
        id: docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          version: v29.8.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Select one Docker endpoint and check its bridge
        env:
          DOCKER_HOST: ${{ steps.docker.outputs.sock }}
        run: |
          test -S "${DOCKER_HOST#unix://}"
          printf 'DOCKER_HOST=%s\n' "$DOCKER_HOST" >> "$GITHUB_ENV"
          network=$(docker network create \
            --driver bridge \
            --opt com.docker.network.bridge.enable_icc=false \
            --label io.mechane.owner=ci-prerequisite \
            "mechane-prerequisite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          docker network rm "$network"
      - name: Set up the candidate image builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Check public repository guidance
        run: |
          mise run contracts:check
          mise run repository:check
      - name: Build and qualify the selected candidate once
        env:
          REUSE_GUEST_DIRECTORY: ${{ steps.guest.outputs.directory }}
          REUSE_GUEST_QUALIFICATION_SHA256: ${{ inputs.reuse_guest_qualification_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$REUSE_GUEST_DIRECTORY" ]]; then
            mise -C workspaces/core run distribution:candidate
          else
            candidate_version=$(mise -C workspaces/core/packages/node/distribution exec -- node --input-type=module \
              --eval 'import { RELEASE } from "@mechane/protocol"; process.stdout.write(RELEASE)')
            candidate_directory="$GITHUB_WORKSPACE/workspaces/core/dist/distribution/v$candidate_version"
            mise -C workspaces/core run distribution:candidate -- "$candidate_directory" \
              --reuse-guest "$REUSE_GUEST_DIRECTORY" "$REUSE_GUEST_QUALIFICATION_SHA256"
          fi
      - name: Retain the qualified candidate for promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-candidate-${{ github.sha }}
          path: workspaces/core/dist/distribution/v*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Print retained local service logs after a failed smoke
        if: failure()
        run: |
          shopt -s nullglob
          for log in "${TMPDIR:-/tmp}"/mechane-node-stack-*/*.log \
            "${TMPDIR:-/tmp}"/mechane-node-stack-*/application/.celld/{celld,build}.log \
            "${TMPDIR:-/tmp}"/mechane-node-stack-*/sandbox/.celld/celld.log \
            "${TMPDIR:-/tmp}"/mechane-node-failure-*/*.log; do
            echo "== $log"
            tail -n 80 "$log"
          done
