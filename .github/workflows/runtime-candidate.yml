name: Build runtime candidate
run-name: Runtime candidate ${{ github.sha }}
on:
  push:
    branches: [main]
    paths:
      - workspaces/core/packages/shared/releases/src/release.ts
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full public source commit; must match the selected workflow ref
        required: true
        type: string
      reuse_guest_release:
        description: Existing runtime release tag for verified guest reuse, paired with its qualification SHA-256
        required: false
        type: string
      reuse_guest_qualification_sha256:
        description: Exact qualification.json SHA-256 for the selected existing guest release
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: runtime-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'mechane-ai/mechane'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MECHANE_BASE_BRANCH: origin/main
    outputs:
      core_artifact_id: ${{ steps.archive_core.outputs.artifact-id }}
      core_archive_sha256: ${{ steps.inventory.outputs.core_archive_sha256 }}
      guest_artifact_id: ${{ steps.archive_guest.outputs.artifact-id }}
      guest_archive_sha256: ${{ steps.inventory.outputs.guest_archive_sha256 }}
      cli_other_artifact_id: ${{ steps.archive_cli_other.outputs.artifact-id }}
      cli_other_archive_sha256: ${{ steps.inventory.outputs.cli_other_archive_sha256 }}
      artifacts_sha256: ${{ steps.inventory.outputs.artifacts_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the candidate directory
        run: printf 'CANDIDATE_DIRECTORY=%s/mechane-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the selected source before building
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          reject_source() {
            printf '::error::%s\n' "$1"
            exit 1
          }
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || reject_source 'Use the complete 40-character lowercase source commit.'
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA" || reject_source 'The selected workflow ref differs from the reviewed source. Select a branch or tag at that commit.'
          checkout_commit=$(git rev-parse HEAD) || reject_source 'Could not read the checked-out commit.'
          test "$checkout_commit" = "$EXPECTED_COMMIT" || reject_source 'The checkout differs from the reviewed source commit.'
          checkout_changes=$(git status --porcelain) || reject_source 'Could not inspect the candidate checkout.'
          test -z "$checkout_changes" || reject_source 'The candidate checkout contains local changes before setup.'
      - name: Validate the qualified guest selection
        env:
          REUSE_GUEST_RELEASE: ${{ inputs.reuse_guest_release }}
          REUSE_GUEST_QUALIFICATION_SHA256: ${{ inputs.reuse_guest_qualification_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$REUSE_GUEST_RELEASE" && -z "$REUSE_GUEST_QUALIFICATION_SHA256" ]]; then
            exit 0
          fi
          if [[ -z "$REUSE_GUEST_RELEASE" || -z "$REUSE_GUEST_QUALIFICATION_SHA256" ]]; then
            printf '::error::Select both an existing guest release and its qualification SHA-256.\n'
            exit 1
          fi
          if [[ ! "$REUSE_GUEST_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf '::error::Use a runtime release tag such as v0.33.1.\n'
            exit 1
          fi
          if [[ ! "$REUSE_GUEST_QUALIFICATION_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf '::error::Use the complete 64-character lowercase qualification SHA-256.\n'
            exit 1
          fi
      - uses: ./.github/actions/setup
        with:
          tools: node pnpm bun go github:macromackie/tenet aqua:koalaman/shellcheck aqua:rhysd/actionlint
      - name: Select a qualified guest with identical build inputs
        id: guest
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_GUEST_RELEASE: ${{ inputs.reuse_guest_release }}
          REUSE_GUEST_QUALIFICATION_SHA256: ${{ inputs.reuse_guest_qualification_sha256 }}
        run: |
          set -euo pipefail
          mise -C workspaces/core run build:guest
          mise exec -- node .config/runtime-guest-selection.mts
      - if: steps.guest.outputs.directory == ''
        uses: ./.github/actions/candidate-docker
      - name: Set up the candidate image builder
        if: steps.guest.outputs.directory == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Check public repository guidance
        run: |
          mise run contracts:check
          mise run repository:check
      - name: Build the selected candidate once
        env:
          REUSE_GUEST_DIRECTORY: ${{ steps.guest.outputs.directory }}
          REUSE_GUEST_QUALIFICATION_SHA256: ${{ steps.guest.outputs.qualification }}
        run: |
          set -euo pipefail
          if [[ -z "$REUSE_GUEST_DIRECTORY" ]]; then
            mise -C workspaces/core run distribution:build -- "$CANDIDATE_DIRECTORY" \
              2>&1 | tee "$RUNNER_TEMP/mechane-build.log"
          else
            mise -C workspaces/core run distribution:build -- "$CANDIDATE_DIRECTORY" \
              --reuse-guest "$REUSE_GUEST_DIRECTORY" "$REUSE_GUEST_QUALIFICATION_SHA256" \
              2>&1 | tee "$RUNNER_TEMP/mechane-build.log"
          fi
      - name: Package the unqualified bytes with their executable modes
        id: inventory
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE_DIRECTORY/qualification.json"
          artifacts_sha256=$(sha256sum "$CANDIDATE_DIRECTORY/artifacts.json" | cut -d ' ' -f 1)
          shopt -s nullglob
          guest_files=( "$CANDIDATE_DIRECTORY"/mechane-guest-*.oci.tar )
          test "${#guest_files[@]}" -eq 1
          guest_name=$(basename "${guest_files[0]}")
          other_cli=( mechane-darwin-arm64 mechane-darwin-x64 mechane-linux-arm64 )
          tar -cf "$RUNNER_TEMP/mechane-candidate-guest.tar" -C "$CANDIDATE_DIRECTORY" "$guest_name"
          tar -cf "$RUNNER_TEMP/mechane-candidate-cli-other.tar" -C "$CANDIDATE_DIRECTORY" "${other_cli[@]}"
          tar --exclude="$guest_name" --exclude=mechane-darwin-arm64 --exclude=mechane-darwin-x64 --exclude=mechane-linux-arm64 \
            -cf "$RUNNER_TEMP/mechane-candidate-core.tar" -C "$CANDIDATE_DIRECTORY" .
          core_archive_sha256=$(sha256sum "$RUNNER_TEMP/mechane-candidate-core.tar" | cut -d ' ' -f 1)
          guest_archive_sha256=$(sha256sum "$RUNNER_TEMP/mechane-candidate-guest.tar" | cut -d ' ' -f 1)
          cli_other_archive_sha256=$(sha256sum "$RUNNER_TEMP/mechane-candidate-cli-other.tar" | cut -d ' ' -f 1)
          {
            printf 'artifacts_sha256=%s\n' "$artifacts_sha256"
            printf 'core_archive_sha256=%s\n' "$core_archive_sha256"
            printf 'guest_archive_sha256=%s\n' "$guest_archive_sha256"
            printf 'cli_other_archive_sha256=%s\n' "$cli_other_archive_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Retain unqualified core build for acceptance retries
        id: archive_core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-unqualified-core-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-candidate-core.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain unqualified guest build for container shards
        id: archive_guest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-unqualified-guest-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-candidate-guest.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain unqualified cross-platform CLIs for canonical sealing
        id: archive_cli_other
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-unqualified-cli-other-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-candidate-cli-other.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect bounded build diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mechane-build-logs"
          if [[ -f "$RUNNER_TEMP/mechane-build.log" ]]; then
            tail -c 262144 "$RUNNER_TEMP/mechane-build.log" > "$RUNNER_TEMP/mechane-build-logs/build.log"
          fi
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-build-logs-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-build-logs
          if-no-files-found: ignore
          retention-days: 3
  qualify-static:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MECHANE_BASE_BRANCH: origin/main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the candidate directory
        run: printf 'CANDIDATE_DIRECTORY=%s/mechane-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the qualification inputs
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit || github.sha }}
          CORE_ARTIFACT_ID: ${{ needs.build.outputs.core_artifact_id }}
          CORE_ARCHIVE_SHA256: ${{ needs.build.outputs.core_archive_sha256 }}
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          checkout_commit=$(git rev-parse HEAD)
          if [[ "$checkout_commit" != "$EXPECTED_COMMIT" ]]; then
            printf '::error::The qualification checkout differs from the selected source commit.\n'
            exit 1
          fi
          if [[ ! "$CORE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$CORE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ||
            ! "$ARTIFACTS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf '::error::Select the completed core artifact ID and exact SHA-256 digests.\n'
            exit 1
          fi
      - name: Download the exact unqualified core build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.core_artifact_id }}
          path: ${{ runner.temp }}/mechane-build-download
      - name: Verify and unpack the selected core build
        env:
          CORE_ARCHIVE_SHA256: ${{ needs.build.outputs.core_archive_sha256 }}
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mechane-build-download/mechane-candidate-core.tar"
          printf '%s  %s\n' "$CORE_ARCHIVE_SHA256" "$archive" | sha256sum -c
          mkdir "$CANDIDATE_DIRECTORY"
          tar -xf "$archive" -C "$CANDIDATE_DIRECTORY"
          printf '%s  %s\n' "$ARTIFACTS_SHA256" "$CANDIDATE_DIRECTORY/artifacts.json" | sha256sum -c
          test ! -e "$CANDIDATE_DIRECTORY/qualification.json"
      - uses: ./.github/actions/setup
        with:
          tools: node pnpm go opentofu github:macromackie/tenet github:macromackie/ev-grep aqua:koalaman/shellcheck aqua:rhysd/actionlint
      - name: Qualify static, infrastructure, and shipped-format checks
        env:
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          mise -C workspaces/core run distribution:accept-static -- "$CANDIDATE_DIRECTORY" "$ARTIFACTS_SHA256" \
            2>&1 | tee "$RUNNER_TEMP/mechane-static.log"
          mkdir -p "$RUNNER_TEMP/mechane-static-output"
          cp "$CANDIDATE_DIRECTORY/qualification-static-receipt.json" \
            "$CANDIDATE_DIRECTORY/qualification-static.log" \
            "$CANDIDATE_DIRECTORY/qualification-shipped-formats.log" \
            "$RUNNER_TEMP/mechane-static-output/"
      - name: Upload static receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-static-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-static-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect bounded static diagnostics
        if: always()
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/mechane-static-logs"
          mkdir -p "$logs"
          if [[ -f "$RUNNER_TEMP/mechane-static.log" ]]; then
            tail -c 262144 "$RUNNER_TEMP/mechane-static.log" > "$logs/static.log"
          fi
      - name: Retain static diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-static-logs-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-static-logs
          if-no-files-found: ignore
          retention-days: 3
  qualify-shard:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: auth
            needs_container: false
          - shard: managed-core
            needs_container: false
          - shard: managed-advanced
            needs_container: false
          - shard: lifecycle-context
            needs_container: false
          - shard: lifecycle-core
            needs_container: false
          - shard: lifecycle-recovery
            needs_container: false
          - shard: console
            needs_container: true
          - shard: compute-core
            needs_container: true
          - shard: compute-capacity
            needs_container: true
          - shard: compute-browser
            needs_container: true
          - shard: compute-drain
            needs_container: true
          - shard: compute-recovery
            needs_container: true
          - shard: compute-restore
            needs_container: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MECHANE_BASE_BRANCH: origin/main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the candidate directory
        run: printf 'CANDIDATE_DIRECTORY=%s/mechane-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the qualification inputs
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit || github.sha }}
          CORE_ARTIFACT_ID: ${{ needs.build.outputs.core_artifact_id }}
          CORE_ARCHIVE_SHA256: ${{ needs.build.outputs.core_archive_sha256 }}
          GUEST_ARTIFACT_ID: ${{ needs.build.outputs.guest_artifact_id }}
          GUEST_ARCHIVE_SHA256: ${{ needs.build.outputs.guest_archive_sha256 }}
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
          NEEDS_CONTAINER: ${{ matrix.needs_container }}
        run: |
          set -euo pipefail
          checkout_commit=$(git rev-parse HEAD)
          if [[ "$checkout_commit" != "$EXPECTED_COMMIT" ]]; then
            printf '::error::The qualification checkout differs from the selected source commit.\n'
            exit 1
          fi
          if [[ ! "$CORE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$CORE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ||
            ! "$ARTIFACTS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf '::error::Select the completed core artifact ID and exact SHA-256 digests.\n'
            exit 1
          fi
          if [[ "$NEEDS_CONTAINER" == "true" ]]; then
            if [[ ! "$GUEST_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$GUEST_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              printf '::error::Select the completed guest artifact ID and exact SHA-256 digest.\n'
              exit 1
            fi
          fi
      - name: Download the exact unqualified core build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.core_artifact_id }}
          path: ${{ runner.temp }}/mechane-build-download
      - name: Download the exact unqualified guest build
        if: matrix.needs_container
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.guest_artifact_id }}
          path: ${{ runner.temp }}/mechane-build-download
      - name: Verify and unpack the selected build
        env:
          CORE_ARCHIVE_SHA256: ${{ needs.build.outputs.core_archive_sha256 }}
          GUEST_ARCHIVE_SHA256: ${{ needs.build.outputs.guest_archive_sha256 }}
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
          NEEDS_CONTAINER: ${{ matrix.needs_container }}
        run: |
          set -euo pipefail
          core_archive="$RUNNER_TEMP/mechane-build-download/mechane-candidate-core.tar"
          printf '%s  %s\n' "$CORE_ARCHIVE_SHA256" "$core_archive" | sha256sum -c
          mkdir "$CANDIDATE_DIRECTORY"
          tar -xf "$core_archive" -C "$CANDIDATE_DIRECTORY"
          if [[ "$NEEDS_CONTAINER" == "true" ]]; then
            guest_archive="$RUNNER_TEMP/mechane-build-download/mechane-candidate-guest.tar"
            printf '%s  %s\n' "$GUEST_ARCHIVE_SHA256" "$guest_archive" | sha256sum -c
            tar -xf "$guest_archive" -C "$CANDIDATE_DIRECTORY"
          fi
          printf '%s  %s\n' "$ARTIFACTS_SHA256" "$CANDIDATE_DIRECTORY/artifacts.json" | sha256sum -c
          test ! -e "$CANDIDATE_DIRECTORY/qualification.json"
      - uses: ./.github/actions/setup
        with:
          tools: node pnpm github:mechane-ai/celld
      - if: matrix.needs_container
        uses: ./.github/actions/candidate-docker
      - name: Qualify shard ${{ matrix.shard }} without rebuilding
        env:
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mise -C workspaces/core run distribution:accept-shard -- "$CANDIDATE_DIRECTORY" "$ARTIFACTS_SHA256" "$SHARD" \
            2>&1 | tee "$RUNNER_TEMP/mechane-shard-$SHARD.log"
          mkdir -p "$RUNNER_TEMP/mechane-shard-output"
          cp "$CANDIDATE_DIRECTORY/qualification-shard-$SHARD.json" "$CANDIDATE_DIRECTORY/qualification-shard-$SHARD.log" \
            "$RUNNER_TEMP/mechane-shard-output/"
      - name: Upload shard receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-shard-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-shard-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect bounded shard diagnostics
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/mechane-qualification-logs"
          mkdir -p "$logs"
          if [[ -f "$RUNNER_TEMP/mechane-shard-$SHARD.log" ]]; then
            tail -c 262144 "$RUNNER_TEMP/mechane-shard-$SHARD.log" > "$logs/shard-$SHARD.log"
          fi
          shopt -s nullglob
          {
            for log in "${TMPDIR:-/tmp}"/mechane-node-stack-*/*.log \
              "${TMPDIR:-/tmp}"/mechane-node-stack-*/application/.celld/{celld,build}.log \
              "${TMPDIR:-/tmp}"/mechane-node-stack-*/sandbox/.celld/celld.log \
              "${TMPDIR:-/tmp}"/mechane-node-failure-*/*.log; do
              echo "== $log"
              tail -c 65536 "$log" | tail -n 80
            done
          } | tail -c 262144 | tee "$logs/local-services.log"
      - name: Retain shard diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-qualification-logs-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-qualification-logs
          if-no-files-found: ignore
          retention-days: 3
  qualify:
    needs: [build, qualify-static, qualify-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MECHANE_BASE_BRANCH: origin/main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the candidate directory
        run: printf 'CANDIDATE_DIRECTORY=%s/mechane-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the qualification inputs
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit || github.sha }}
          CORE_ARTIFACT_ID: ${{ needs.build.outputs.core_artifact_id }}
          CORE_ARCHIVE_SHA256: ${{ needs.build.outputs.core_archive_sha256 }}
          GUEST_ARTIFACT_ID: ${{ needs.build.outputs.guest_artifact_id }}
          GUEST_ARCHIVE_SHA256: ${{ needs.build.outputs.guest_archive_sha256 }}
          CLI_OTHER_ARTIFACT_ID: ${{ needs.build.outputs.cli_other_artifact_id }}
          CLI_OTHER_ARCHIVE_SHA256: ${{ needs.build.outputs.cli_other_archive_sha256 }}
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          checkout_commit=$(git rev-parse HEAD)
          if [[ "$checkout_commit" != "$EXPECTED_COMMIT" ]]; then
            printf '::error::The qualification checkout differs from the selected source commit.\n'
            exit 1
          fi
          if [[ ! "$CORE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$CORE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ||
            ! "$GUEST_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$GUEST_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ||
            ! "$CLI_OTHER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$CLI_OTHER_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ||
            ! "$ARTIFACTS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf '::error::Select all completed build artifact IDs and exact SHA-256 digests.\n'
            exit 1
          fi
      - name: Download the complete unqualified build parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.core_artifact_id }},${{ needs.build.outputs.guest_artifact_id }},${{ needs.build.outputs.cli_other_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/mechane-build-download
      - name: Download the static receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mechane-static-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-shards
      - name: Download all completed shard receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mechane-shard-*-${{ github.sha }}-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/mechane-shards
      - name: Verify and unpack the complete build
        env:
          CORE_ARCHIVE_SHA256: ${{ needs.build.outputs.core_archive_sha256 }}
          GUEST_ARCHIVE_SHA256: ${{ needs.build.outputs.guest_archive_sha256 }}
          CLI_OTHER_ARCHIVE_SHA256: ${{ needs.build.outputs.cli_other_archive_sha256 }}
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          core_archive="$RUNNER_TEMP/mechane-build-download/mechane-candidate-core.tar"
          guest_archive="$RUNNER_TEMP/mechane-build-download/mechane-candidate-guest.tar"
          cli_other_archive="$RUNNER_TEMP/mechane-build-download/mechane-candidate-cli-other.tar"
          printf '%s  %s\n' "$CORE_ARCHIVE_SHA256" "$core_archive" | sha256sum -c
          printf '%s  %s\n' "$GUEST_ARCHIVE_SHA256" "$guest_archive" | sha256sum -c
          printf '%s  %s\n' "$CLI_OTHER_ARCHIVE_SHA256" "$cli_other_archive" | sha256sum -c
          mkdir "$CANDIDATE_DIRECTORY"
          tar -xf "$core_archive" -C "$CANDIDATE_DIRECTORY"
          tar -xf "$guest_archive" -C "$CANDIDATE_DIRECTORY"
          tar -xf "$cli_other_archive" -C "$CANDIDATE_DIRECTORY"
          printf '%s  %s\n' "$ARTIFACTS_SHA256" "$CANDIDATE_DIRECTORY/artifacts.json" | sha256sum -c
          test ! -e "$CANDIDATE_DIRECTORY/qualification.json"
      - uses: ./.github/actions/setup
        with:
          tools: node pnpm
      - name: Seal canonical qualification from static and shard receipts
        env:
          ARTIFACTS_SHA256: ${{ needs.build.outputs.artifacts_sha256 }}
        run: |
          set -euo pipefail
          mise -C workspaces/core run distribution:merge-qualification -- \
            "$CANDIDATE_DIRECTORY" "$ARTIFACTS_SHA256" "$RUNNER_TEMP/mechane-shards" \
            2>&1 | tee "$RUNNER_TEMP/mechane-acceptance.log"
      - name: Retain the qualified candidate for promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-candidate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ env.CANDIDATE_DIRECTORY }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Collect bounded qualification diagnostics
        if: always()
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/mechane-qualification-logs"
          mkdir -p "$logs"
          if [[ -f "$RUNNER_TEMP/mechane-acceptance.log" ]]; then
            tail -c 262144 "$RUNNER_TEMP/mechane-acceptance.log" > "$logs/acceptance.log"
          fi
      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mechane-qualification-logs-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mechane-qualification-logs
          if-no-files-found: ignore
          retention-days: 3
