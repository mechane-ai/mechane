name: Set up pinned tools
description: Verify mise and install the repository's locked tools and packages without a CI cache.
inputs:
  tools:
    description: Optional space-separated mise tool specs from mise.lock to install instead of the full toolset.
    required: false
    default: ''
  install-packages:
    description: Whether to install locked workspace packages after tool installation.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Read the reviewed mise release
      id: mise-release
      shell: bash
      run: |
        source .config/mise-release.sh
        echo "version=$(mise_release_version)" >> "$GITHUB_OUTPUT"
        echo "sha256=$(mise_release_digest linux-x64)" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/bootstrap-mise
      id: mise-bootstrap
      with:
        version: ${{ steps.mise-release.outputs.version }}
        sha256: ${{ steps.mise-release.outputs.sha256 }}
    - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      with:
        version: ${{ steps.mise-bootstrap.outputs.version }}
        mise_dir: ${{ steps.mise-bootstrap.outputs.directory }}
        sha256: ${{ steps.mise-bootstrap.outputs.sha256 }}
        install: false
        cache: false
    - name: Put the bootstrap's tools on PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Disable implicit mise downloads when scoped to selected tools
      if: inputs.tools != ''
      shell: bash
      run: echo "MISE_AUTO_INSTALL=false" >> "$GITHUB_ENV"
    - name: Install the pinned mise, tools and locked packages
      shell: bash
      env:
        MECHANE_SETUP_TOOLS: ${{ inputs.tools }}
        MECHANE_SETUP_PACKAGES: ${{ inputs.install-packages }}
      run: .config/bootstrap.sh
