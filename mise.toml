# Pinned tools from the canonical source.
min_version = "2026.10.17"

[settings]
locked = true
activate_aggressive = true

[tools]
node = "24.22.1"
pnpm = "12.16.1"
bun = "1.4.4"
go = "1.27.3"
opentofu = "1.13.0"
"github:macromackie/tenet" = "0.13.0"
"github:macromackie/ev-grep" = "0.7.0"
"aqua:koalaman/shellcheck" = "0.11.0"

[tools."github:mechane-ai/celld"]
version = "0.6.3-mechane.3"
prerelease = true
rename_exe = "celld"

[tools."github:mechane-ai/celld".platforms.linux-arm64]
asset_pattern = "celld-aarch64-unknown-linux-gnu.gz"
checksum = "sha256:0ea3545ea53557e91c3b1602381e3dbf94a80820e507a1d5456b042eec473d09"

[tools."github:mechane-ai/celld".platforms.linux-x64]
asset_pattern = "celld-x86_64-unknown-linux-gnu.gz"
checksum = "sha256:3559950018314ec3db05b4550c7c8b370f891381f4070737dde33ef5db192fd8"

[tools."github:mechane-ai/celld".platforms.macos-arm64]
asset_pattern = "celld-aarch64-apple-darwin.gz"
checksum = "sha256:d5682aae32604066b65246736497b86e7128ae422d4113a25c29e3e3fd70a5b4"

[tasks.setup]
description = "Install the product's locked packages"
run = "mise -C workspaces/core run setup"

[tasks.check]
description = "Run every repository and product check"
depends = ["contracts:check", "repository:check"]
run = "mise -C workspaces/core run check"

[tasks."contracts:check"]
description = "Validate repository and product contracts"
run = "tenet validate --root ."

[tasks."repository:check"]
description = "Check repository formatting, bootstrap, and package publication tools"
run = [
  "workspaces/core/node_modules/.bin/oxfmt --check . '!workspaces/**'",
  "shellcheck .config/*.sh",
  "workspaces/core/node_modules/.bin/tsc -p .config/tsconfig.json",
  "workspaces/core/node_modules/.bin/oxlint .config/*.mts",
  "workspaces/core/node_modules/.bin/oxlint .github/actions/bootstrap-mise/*.mts",
]

[tasks.fix]
description = "Format the repository and apply the product's fixers"
run = ["workspaces/core/node_modules/.bin/oxfmt . '!workspaces/**'", "mise -C workspaces/core run fix"]

[tasks.dev]
description = "Run the retained local Worker fixture with source reload and scripted models"
run = "mise -C workspaces/core run dev"

[tasks.start]
description = "Run a persistent local Mechane installation from source"
run = "mise -C workspaces/core run start --"

[tasks."local:reset"]
description = "Reset an inactive local installation only with --confirm"
run = "mise -C workspaces/core run local:reset --"

[tasks.mechane]
description = "Run the Mechane CLI from source"
run = "mise -C workspaces/core run mechane --"
